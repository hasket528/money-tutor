<!DOCTYPE html>
<html lang="zh-TW">
<head>
        <link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27><text y=%27.9em%27 font-size=%2790%27>💰</text></svg>">
<meta charset="UTF-8">
<script src="../js/emoji-font.js"></script>
<meta name="darkreader-lock"><!-- 本站自帶深淺色切換：請 Dark Reader 等外掛別再疊一層（2026-09-24） -->
<meta name="color-scheme" content="light dark">
<script>(function(){try{var t=localStorage.getItem("mt_theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
<script src="../js/tablet-layout.js"></script><!-- iPad 橫式版面判斷：要在所有 CSS 之前（2026-10-02） -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A1 - 自動販賣機</title>
    <link rel="stylesheet" href="../css/a1_vending_machine.css">
    <link rel="stylesheet" href="../css/common-modal-responsive.css">
    <link rel="stylesheet" href="../css/dark-mode-simple.css">
    <!-- 聊天機器人樣式 -->
    <link rel="stylesheet" href="../css/chatbot.css">
    <!-- iPad 橫式版面（只在 html.tablet-land 生效，必須最後載入） -->
    <link rel="stylesheet" href="../css/tablet-landscape.css">
</head>
<body class="a1-unit">
    <!-- 主要應用程式容器 -->
    <main id="app" role="main">
        <!-- 內容將由 JavaScript 動態生成 -->
    </main>

    <!-- 成功音效 -->
    <audio id="success-sound" src="../audio/units/success.mp3" preload="auto"></audio>

    <!-- 載入 canvas-confetti 煙火庫 -->
    <script src="../js/confetti.browser.min.js"></script>

    <!-- 行動裝置音訊解鎖 -->
    <script src="../js/audio-unlocker.js"></script>

    <!-- 獎勵系統 -->
    <script src="../js/reward-launcher.js"></script>
    <script src="../js/theme-switch.js"></script>
    <script src="../js/student-badge.js"></script>
    <script src="../js/student-picker.js"></script>
    <script src="../js/learning-tracker.js"></script>
    <script src="../js/result-voice.js"></script>

    <!-- 數字語音轉換工具 -->
    <script src="../js/number-speech-utils.js"></script>

    <!-- 載入核心邏輯 -->
    <script src="../js/choice-mark.js"></script>
    <script src="../js/a1_vending_machine.js?v=1.6.5"></script>

    <!-- 聊天機器人（Feature Flag 預設關閉，網址加 ?chatbot=1 可開啟測試）-->
    <script src="../js/chatbot-content.js"></script>
    <script src="../js/chatbot-context.js"></script>
    <script src="../js/chatbot-engine.js"></script>
    <!-- 掃描付款（外掛層，不改本單元的 js 一個字；不載入就完全回到原行為）
         入口預設不顯示，網址加 ?scanpay=1 才會出現——教具卡要先印得出來才有意義。
         教具卡：worksheet/money-cards.html　設計：doc/開發計畫/開發計畫_掃描付款_QR教具卡.md -->
    <script src="../js/scan-pay/vendor/aruco/cv.js"></script>
    <script src="../js/scan-pay/vendor/aruco/aruco.js"></script>
    <script src="../js/scan-pay/vendor/aruco/dictionaries/apriltag_16h5.js"></script>
    <script src="../js/scan-pay/mt-markers.js"></script>
    <script src="../js/scan-pay/scan-pay.js"></script>
    <script src="../js/scan-pay/units/scan-pay-a1.js"></script>
    <script src="../js/scan-pay/settings-tools.js"></script>

<script src="../js/money-label-hint.js"></script><!-- 付款／找零：金額字按提示才顯示（2026-10-06） -->
</body>
</html>
